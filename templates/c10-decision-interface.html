<script>
(() => {
  const root=document.getElementById('moxing-chart');
  const params=new URLSearchParams(location.search);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||params.get('motion')==='off';
  const requestedProfile=params.get('motion')||'standard';
  const profile=['brief','standard','story'].includes(requestedProfile)?requestedProfile:'standard';
  const scales={brief:0.72,standard:1.0,story:1.8};
  const scale=scales[profile]||1;
  const macroProfiles={brief:{fieldDelay:25,fieldDuration:420,plotDelay:180,plotDuration:360,lockDuration:220},standard:{fieldDelay:40,fieldDuration:680,plotDelay:320,plotDuration:620,lockDuration:260},story:{fieldDelay:60,fieldDuration:900,plotDelay:480,plotDuration:780,lockDuration:320}};
  const stagedMacroProfiles={...macroProfiles,standard:{...macroProfiles.standard,fieldDelay:30,lockDuration:300,evidenceDuration:360},brief:{...macroProfiles.brief,evidenceDuration:280},story:{...macroProfiles.story,evidenceDuration:440}};
  const activeMacroProfiles=root.querySelector('.pm-plot-layer')?stagedMacroProfiles:macroProfiles;
  const macro=activeMacroProfiles[profile]||activeMacroProfiles.standard;
  root.style.setProperty('--pm-field-delay',macro.fieldDelay+'ms');
  root.style.setProperty('--pm-field-duration',macro.fieldDuration+'ms');
  root.style.setProperty('--pm-plot-delay',macro.plotDelay+'ms');
  root.style.setProperty('--pm-plot-duration',macro.plotDuration+'ms');
  root.style.setProperty('--pm-lock-duration',macro.lockDuration+'ms');
  root.style.setProperty('--pm-evidence-duration',(macro.evidenceDuration||360)+'ms');
  const directField=root.querySelector('.pm-direct-field');
  if(directField){
    const profileLock=parseFloat(directField.style.getPropertyValue('--pm-lock-delay-'+profile));
    const standardLock=parseFloat(directField.style.getPropertyValue('--pm-lock-delay'))||980;
    root.style.setProperty('--pm-active-lock-delay',(Number.isFinite(profileLock)?profileLock:standardLock)+'ms');
  }
  const embeddedField=root.querySelector('.pm-embedded-field');
  if(embeddedField){
    const profileEvidence=parseFloat(embeddedField.style.getPropertyValue('--pm-evidence-delay-'+profile));
    const standardEvidence=parseFloat(embeddedField.style.getPropertyValue('--pm-evidence-delay'))||760;
    const profileLock=parseFloat(embeddedField.style.getPropertyValue('--pm-lock-delay-'+profile));
    const standardLock=parseFloat(embeddedField.style.getPropertyValue('--pm-lock-delay'))||1080;
    root.style.setProperty('--pm-active-evidence-delay',(Number.isFinite(profileEvidence)?profileEvidence:standardEvidence)+'ms');
    root.style.setProperty('--pm-active-lock-delay',(Number.isFinite(profileLock)?profileLock:standardLock)+'ms');
  }
  const profileKey='total'+profile[0].toUpperCase()+profile.slice(1);
  const total=Number(root.dataset[profileKey]||root.dataset.total||1800);
  const baseDuration={align:220,dock:620,route:520,lock:280};
  root.querySelectorAll('[data-motion]').forEach(el=>{
    const rawDelay=parseFloat(el.style.getPropertyValue('--delay'))||0;
    const rawDuration=parseFloat(el.style.getPropertyValue('--duration'))||baseDuration[el.dataset.motion]||300;
    const profileDelay=parseFloat(el.style.getPropertyValue('--delay-'+profile));
    const profileDuration=parseFloat(el.style.getPropertyValue('--duration-'+profile));
    el.style.setProperty('--active-delay',Math.round(Number.isFinite(profileDelay)?profileDelay:rawDelay*scale)+'ms');
    el.style.setProperty('--active-duration',Math.round(Number.isFinite(profileDuration)?profileDuration:rawDuration*scale)+'ms');
  });
  let timer=0,frame=0,rewindTimer=0;
  const rewindDuration=Math.round(120*Math.max(.72,scale));
  root.style.setProperty('--pm-rewind-duration',rewindDuration+'ms');
  const settle=()=>{ clearTimeout(timer); clearTimeout(rewindTimer); cancelAnimationFrame(frame); root.classList.remove('is-playing','is-paused','is-preparing','is-rewinding'); root.classList.add('is-complete'); const b=root.querySelector('[data-action=pause]'); if(b)b.textContent='Ⅱ'; };
  const replay=()=>{
    clearTimeout(timer); clearTimeout(rewindTimer); cancelAnimationFrame(frame); root.classList.remove('is-playing','is-complete','is-paused','is-preparing','is-rewinding');
    if(reduce){settle();return;}
    root.style.setProperty('--motion-scale',scale); root.classList.add('motion-enabled','is-rewinding');

      frame=requestAnimationFrame(()=>{
        root.classList.remove('is-rewinding');
        root.classList.add('is-playing');
        timer=setTimeout(settle,total+120);
      });
    },rewindDuration);
  };
  const pause=()=>{ root.classList.toggle('is-paused'); const b=root.querySelector('[data-action=pause]'); b.textContent=root.classList.contains('is-paused')?'▶':'Ⅱ'; };

  root.querySelector('[data-action=pause]').addEventListener('click',pause);
  root.querySelector('[data-action=surface]').addEventListener('click',()=>{ const html=document.documentElement; html.dataset.surface=html.dataset.surface==='dark'?'light':'dark'; });
  if(params.get('theme')==='dark') document.documentElement.dataset.surface='dark';
  window.Moxing={replay,settle,setSurface:(v)=>document.documentElement.dataset.surface=v,profile,duration:total+rewindDuration,rewindDuration,ready:Promise.resolve()};
  if(reduce||params.get('autoplay')==='off') settle();
  else if('IntersectionObserver'in window){ const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){io.disconnect();replay();}},{threshold:.35});io.observe(root); }
  else replay();
})();
</script>
</body>
</html>
