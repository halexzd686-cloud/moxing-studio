name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/validate_skill.py
      - run: python scripts/export_examples.py
      - run: git diff --exit-code -- examples/data
      - run: python scripts/test_boundaries.py
      - run: node scripts/validate.mjs .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-previews
          path: docs/previews/
